plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bcp.checkmkagent'
    compileSdk 35

    defaultConfig {
        applicationId "com.bcp.checkmkagent"
        minSdk 26
        targetSdk 33
        def ciRun = System.getenv("GITHUB_RUN_NUMBER")
        versionCode((ciRun != null && ciRun.isInteger()) ? (100 + ciRun.toInteger()) : 138)
        versionName "1.3.8"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        release {
            def ks = file("cmkagent.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("CMKAGENT_STORE_PASS") ?: "android"
                keyAlias System.getenv("CMKAGENT_KEY_ALIAS") ?: "cmkagent"
                keyPassword System.getenv("CMKAGENT_KEY_PASS") ?: "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("cmkagent.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            if (file("cmkagent.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
